<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的衣橱</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#373b34;font:15px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px}h1{font-family:Georgia,serif;font-size:36px;margin:8px 0}small{color:#777}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button,select,input{font:inherit;border:1px solid #d8d5cc;border-radius:10px;padding:11px;background:white;color:inherit}button{cursor:pointer}button.primary,button.active{background:#53634e;color:white}section{background:#fff;border-radius:18px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}.item{background:#f7f5ef;border-radius:12px;overflow:hidden;padding:10px}.item img{width:100%;height:180px;object-fit:contain;background:#eeeae2;border-radius:8px}.item p{margin:8px 0}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}label{display:grid;gap:5px}h2{font-size:21px}.outfit{border:1px solid #ddd8ce;border-radius:14px;padding:14px;margin:12px 0}button.danger{color:#9a4747;padding:6px}#status{color:#53634e}input[type=file]{max-width:100%}</style><main><small>MY WARDROBE / PERSONAL STYLE</small><h1>我的衣橱</h1><p>从已有衣物开始，发现更多搭配可能。</p><nav id="nav"></nav><div id="view"></div><p id="status" role="status"></p><small>照片与记录存储在当前浏览器。清除浏览器数据可能导致丢失，请定期备份。</small></main><script>
const cats=['上衣','下装','连衣裙','外套','鞋子','包包','配饰'], colors=['白色','黑色','灰色','米色','棕色','蓝色','绿色','红色','粉色','其他'], seasons=['四季','春秋','夏季','冬季'], scenes=['日常通勤','商务','休闲','约会','旅行'];let db,items=[],saved=[],tab=0,results=[];const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const opts=a=>a.map(x=>`<option>${esc(x)}</option>`).join('');function msg(s){$('#status').textContent=s}function store(){return new Promise((ok,no)=>{let t=db.transaction('data','readwrite');t.objectStore('data').put({items,saved},'wardrobe');t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function persist(){try{await store();msg('已保存')}catch(e){msg('保存失败，请备份数据：'+e.message)}}function card(x){return `<div class="item"><img src="${esc(x.photo)}" alt="${esc(x.name)}"><p><b>${esc(x.name)}</b></p><small>${esc(x.cat)} · ${esc(x.color)} · ${esc(x.season)}</small></div>`}function render(){ $('#nav').innerHTML=['我的衣柜','今日穿搭','收藏','备份管理'].map((s,i)=>`<button class="${tab===i?'active':''}" onclick="go(${i})">${s}</button>`).join('');let v=$('#view');if(tab===0){v.innerHTML=`<section><h2>添加衣物</h2><p>可上传整张衣柜照片作为参考；参与自动搭配的衣物请逐件拍摄或裁剪，并确认分类。</p><input type="file" id="photo" accept="image/*" multiple><div class="controls" style="margin-top:12px"><label>名称<input id="name" placeholder="例如：白色衬衫"></label><label>类别<select id="cat">${opts([...cats,'衣柜参考照'])}</select></label><label>颜色<select id="color">${opts(colors)}</select></label><label>季节<select id="season">${opts(seasons)}</select></label><button class="primary" onclick="add()">添加到衣柜</button></div><small>批量上传时使用相同标签，之后可以逐件修改。</small></section><section><div class="controls"><h2>全部衣物（${items.length}）</h2><select id="filter" onchange="list()">${opts(['全部',...cats,'衣柜参考照'])}</select></div><div class="grid" id="list"></div></section>`;list()}else if(tab===1){v.innerHTML=`<section><h2>今天穿什么？</h2><div class="controls"><label>场合<select id="scene">${opts(scenes)}</select></label><label>温度 °C<input id="temp" type="number" value="18" min="-40" max="50"></label><label>指定单品<select id="anchor"><option value="">不限</option>${items.filter(x=>cats.includes(x.cat)).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><button class="primary" onclick="recommend()">推荐搭配</button></div><p><small>依据手动标签、季节和配色规则推荐，不是联网 AI 识图。</small></p><div id="results"></div></section>`;showResults()}else if(tab===2){v.innerHTML='<section><h2>我的收藏</h2>'+ (saved.length?saved.map((r,i)=>outfit(r,i,true)).join(''):'还没有收藏搭配。')+'</section>'}else{v.innerHTML='<section><h2>衣柜数据管理</h2><button onclick="backup()">导出完整备份</button><p>恢复备份会替换当前衣柜，请先导出已有数据。</p><input type="file" accept=".json" onchange="restore(this)"></section>'}}function go(i){tab=i;render()}function list(){let f=$('#filter').value;$('#list').innerHTML=items.filter(x=>f==='全部'||x.cat===f).map(x=>`<div>${card(x)}<div class="controls"><button onclick="edit('${x.id}')">编辑</button><button class="danger" onclick="removeItem('${x.id}')">删除</button></div></div>`).join('')||'还没有衣物，上传照片开始吧。'}function photo(f){return new Promise((ok,no)=>{let r=new FileReader();r.onerror=no;r.onload=()=>{let im=new Image();im.onerror=no;im.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,1200/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.85))};im.src=r.result};r.readAsDataURL(f)})}async function add(){let fs=[...$('#photo').files],name=$('#name').value,cat=$('#cat').value,color=$('#color').value,season=$('#season').value;if(!fs.length)return msg('请先选择照片');try{for(let f of fs)items.push({id:crypto.randomUUID(),name:name||f.name,cat,color,season,photo:await photo(f)});await persist();render()}catch(e){msg('部分照片无法读取，请尝试 JPG 或 PNG');await persist();render()}}function edit(id){let x=items.find(x=>x.id===id);$('#view').innerHTML=`<section><h2>编辑衣物</h2>${card(x)}<label>名称<input id="en" value="${esc(x.name)}"></label><label>类别<select id="ec">${opts([...cats,'衣柜参考照'])}</select></label><label>颜色<select id="eo">${opts(colors)}</select></label><label>季节<select id="es">${opts(seasons)}</select></label><button class="primary" onclick="finishEdit('${id}')">保存</button> <button onclick="render()">取消</button></section>`;$('#ec').value=x.cat;$('#eo').value=x.color;$('#es').value=x.season}async function finishEdit(id){Object.assign(items.find(x=>x.id===id),{name:$('#en').value,cat:$('#ec').value,color:$('#eo').value,season:$('#es').value});await persist();render()}async function removeItem(id){if(confirm('删除这件衣物？')){items=items.filter(x=>x.id!==id);saved=saved.filter(r=>!r.ids.includes(id));results=[];await persist();render()}}function recommend(){let t=Number($('#temp').value),a=$('#anchor').value,scene=$('#scene').value;let eligible=x=>x.id===a||x.season==='四季'||(t>=24?x.season==='夏季':t<=10?x.season==='冬季':x.season==='春秋'||x.season==='冬季');let pool=c=>items.filter(x=>x.cat===c&&eligible(x));let neutral=['白色','黑色','灰色','米色','棕色'];let all=[],bases=pool('连衣裙').map(x=>[x]);for(let x of pool('上衣'))for(let y of pool('下装'))bases.push([x,y]);for(let b of bases){let combos=[b];for(let c of [...(t<20?['外套']:[]),'鞋子','包包','配饰']){let p=pool(c);if(p.length)combos=combos.flatMap(z=>p.slice(0,20).map(x=>[...z,x])).slice(0,500)}for(let z of combos){if(a&&!z.some(x=>x.id===a))continue;let cs=z.map(x=>x.color).filter(c=>!neutral.includes(c));let score=10-new Set(cs).size*2+(z.some(x=>x.cat==='鞋子')?2:0)+(t<20&&z.some(x=>x.cat==='外套')?2:0)+(scene==='商务'?z.filter(x=>neutral.includes(x.color)).length:0);all.push({ids:z.map(x=>x.id),score,scene,temp:t})}}results=all.sort((a,b)=>b.score-a.score).slice(0,5);showResults()}function outfit(r,i,isSaved){let xs=r.ids.map(id=>items.find(x=>x.id===id)).filter(Boolean);return `<div class="outfit"><b>搭配 ${i+1} · ${esc(r.scene)} · ${r.temp}°C</b><div class="grid">${xs.map(card).join('')}</div><p>${xs.map(x=>esc(x.color)).join(' + ')}。${r.temp<20&&!xs.some(x=>x.cat==='外套')?'衣柜缺少适温外套，请注意保暖。':''}${!xs.some(x=>x.cat==='鞋子')?' 尚未匹配鞋子。':''}</p><button onclick="${isSaved?'unsave':'save'}(${i})">${isSaved?'取消收藏':'收藏搭配'}</button></div>`}function showResults(){$('#results').innerHTML=results.map((r,i)=>outfit(r,i,false)).join('')||'暂无匹配方案。请添加适季上衣和下装，或连衣裙，并检查指定单品。'}async function save(i){let r=results[i];if(!saved.some(x=>x.ids.join()===r.ids.join()))saved.push(r);await persist()}async function unsave(i){saved.splice(i,1);await persist();render()}function backup(){let u=URL.createObjectURL(new Blob([JSON.stringify({items,saved})],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='wardrobe-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function restore(el){try{let d=JSON.parse(await el.files[0].text());if(!Array.isArray(d.items)||!Array.isArray(d.saved)||!d.items.every(x=>typeof x.id==='string'&&typeof x.name==='string'&&typeof x.photo==='string'&&x.photo.startsWith('data:image/')&&[...cats,'衣柜参考照'].includes(x.cat))||!d.saved.every(r=>Array.isArray(r.ids)&&typeof r.temp==='number'))throw Error('格式不正确');if(confirm('确认替换当前衣柜？')){items=d.items;saved=d.saved;results=[];await persist();render()}}catch(e){msg('恢复失败：'+e.message)}}let req=indexedDB.open('my-wardrobe-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('data');req.onsuccess=()=>{db=req.result;let r=db.transaction('data').objectStore('data').get('wardrobe');r.onsuccess=()=>{if(r.result)({items,saved}=r.result);render()}};req.onerror=()=>{render();msg('浏览器不支持本地存储，数据仅在当前页面有效。')};</script></html>
